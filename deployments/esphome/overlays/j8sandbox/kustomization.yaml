apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

generators:
  - ./secret-generator.yaml

namespace: home-assistant

patches:
  - target:
      kind: Ingress
      name: esphome
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: esphome-sandbox.local
